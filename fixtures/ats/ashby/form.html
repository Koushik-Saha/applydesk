<!DOCTYPE html>
<html>
<head><title>Apply — Vercel</title></head>
<body>
  <div id="ashby_embed">
    <form>
      <label for="af-name">Name</label>
      <input type="text" id="af-name" name="_systemfield_name" />

      <label for="af-email">Email</label>
      <input type="email" id="af-email" name="_systemfield_email" />

      <label for="af-phone">Phone</label>
      <input type="tel" id="af-phone" name="_systemfield_phone" />

      <label for="af-location">Location</label>
      <input type="text" id="af-location" name="_systemfield_location" />

      <label for="af-resume">Resume</label>
      <input type="file" id="af-resume" name="_systemfield_resume" />

      <label for="af-website">Portfolio Website</label>
      <input type="text" id="af-website" name="website" />

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
