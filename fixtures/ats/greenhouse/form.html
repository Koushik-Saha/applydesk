<!DOCTYPE html>
<html>
<head><title>Apply — Stripe</title></head>
<body>
  <div id="grnhse_app">
    <form id="application_form">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="job_application[first_name]" />

      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="job_application[last_name]" />

      <label for="email">Email</label>
      <input type="email" id="email" name="job_application[email]" />

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="job_application[phone]" />

      <label for="resume">Resume/CV</label>
      <input type="file" id="resume" name="job_application[resume]" />

      <label for="cover_letter">Cover Letter</label>
      <input type="file" id="cover_letter" name="job_application[cover_letter]" />

      <label for="question_linkedin">LinkedIn Profile</label>
      <input type="text" id="question_linkedin" name="job_application[answers][linkedin]" placeholder="LinkedIn URL" />

      <label for="question_essay">Why do you want to work here?</label>
      <textarea id="question_essay" name="job_application[answers][essay]"></textarea>

      <label for="question_gender">Gender</label>
      <select id="question_gender" name="job_application[answers][gender]">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Decline to answer">Decline to answer</option>
      </select>

      <button type="submit" id="submit_app">Submit Application</button>
    </form>
  </div>
</body>
</html>
